name: Super-Linter

on:
  push:
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  lint:
    name: Lint code base
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: true
          # Kotlin via ktlint; C/C++ via clang-format; plus YAML/Markdown/GHA/JSON.
          # Disable linters that conflict or are irrelevant to this codebase.
          VALIDATE_JAVA: false
          VALIDATE_CHECKOV: false
          VALIDATE_JSCPD: false
          # Exclude vendored submodules, generated output, and tooling state.
          FILTER_REGEX_EXCLUDE: '(app/jni/(Paddle-Lite|opencv)/|/build/|\.gradle/|\.omo/|app/src/main/cpp/ocr_clipper\.(cpp|hpp))'
