# Central version catalog. Everything pinned; no dynamic (+) versions.
# NOTE: Kotlin/Compose-BOM/compileSdk bumps to the newest stable are an M1 task
# (requires the android-36 platform + Kotlin<->Compose-compiler<->AGP matrix check).

[versions]
agp = "9.3.1"
kotlin = "2.2.10"
compose-bom = "2024.05.00"
core-ktx = "1.13.1"
lifecycle = "2.8.1"
activity-compose = "1.9.0"
onnxruntime = "1.27.0"
junit-ext = "1.1.5"
espresso = "3.5.1"
ui-test-manifest = "1.6.7"
kotlin-test-junit = "2.0.0"
# M1+ libraries (research-confirmed latest-stable where applicable)
room = "2.8.4"
hilt = "2.57.1"
hilt-navigation-compose = "1.2.0"
workmanager = "2.10.1"
datastore = "1.1.7"
coil = "3.5.0"
navigation-compose = "2.9.1"
paging = "3.3.6"
coroutines = "1.10.2"
kover = "0.9.1"
ksp = "2.2.10-2.0.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
